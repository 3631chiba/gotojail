<title>Re:VOLUTION — Board Game</title>
<style>
:root{--bg:#071525;--panel:#0e2238;--panel2:#122c46;--line:#244967;--text:#eef6ff;--muted:#9db3c8;--red:#e32643;--blue:#2d8cff;--gold:#f4bd38;--green:#18b57a;--cyan:#2bd4d8;--danger:#ff5d66;--shadow:0 16px 45px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#183b5b 0,#071525 45%,#050e18 100%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit}button:disabled{opacity:.42;cursor:not-allowed}
#app{width:min(1500px,100%);margin:auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;background:linear-gradient(135deg,#102a43,#0b1c2e);border:1px solid #315978;border-radius:20px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),#8e142a);font-size:27px;font-weight:1000;box-shadow:0 8px 20px #0006}.brand h1{margin:0;font-size:clamp(26px,4vw,44px);line-height:.95;font-weight:1000;font-style:italic;letter-spacing:-2px}.brand p{margin:5px 0 0;color:var(--muted);font-size:12px;letter-spacing:1px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #315978;background:#16314c;color:#fff;padding:10px 13px;border-radius:12px;font-weight:900;box-shadow:0 4px 12px #0003;transition:.15s transform,.15s filter}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}.btn.primary{background:linear-gradient(135deg,#f02c49,#b91934);border-color:#ff6278}.btn.green{background:linear-gradient(135deg,#19b77d,#0c7954);border-color:#41d59f}.btn.gold{background:linear-gradient(135deg,#f8c94b,#bd7f08);border-color:#ffe08a;color:#1b1508}.btn.cyan{background:linear-gradient(135deg,#32dadd,#138e9c);border-color:#74f5f3;color:#06212b}.btn.danger{background:linear-gradient(135deg,#ff6068,#a51e28);border-color:#ff9aa0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;margin-top:14px}.panel,.card{background:linear-gradient(145deg,#0e243a,#0a1a2b);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:12px;min-width:0}.sidebar{display:grid;gap:12px;align-content:start;min-width:0}.card{padding:12px}.card h3{margin:0 0 10px;font-size:14px;color:#d9e9f7;letter-spacing:.5px}

.space{position:absolute;border:0;background:transparent;border-radius:5px;display:block;padding:0;z-index:5;transition:.12s;touch-action:manipulation}.space.target{outline:4px solid #ffd21f;outline-offset:-4px;background:rgba(255,210,31,.18);box-shadow:inset 0 0 0 999px rgba(255,210,31,.08),0 0 18px #ffd21f66;cursor:pointer}.space.build-target{outline-color:#4cb7ff;background:rgba(76,183,255,.16);box-shadow:inset 0 0 0 999px rgba(76,183,255,.08),0 0 18px #4cb7ff66}.space.selected{outline-color:#20f09a;background:rgba(32,240,154,.22);box-shadow:inset 0 0 0 999px rgba(32,240,154,.08),0 0 22px #20f09a88}.building-marker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;font-weight:1000;text-shadow:0 2px 5px #000;background:#071525dd;border:2px solid #fff8;border-radius:10px;padding:2px 5px;z-index:7;pointer-events:none;white-space:nowrap}.tokens{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);display:flex;gap:2px;z-index:9;pointer-events:none}.token{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:1000;font-size:11px;border:2px solid #fff;box-shadow:0 3px 8px #0008}.t-cap{background:#d92240}.t-w1{background:#2d8cff}.t-w2{background:#8d58d6}.t-w3{background:#16a76f}
.board-nav{display:flex;gap:8px;justify-content:center;margin:9px 0 2px}.board-nav .btn{min-width:120px}
.controls{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;margin-top:10px}.controls .btn{min-height:48px}
.player{padding:10px;border:1px solid #274761;border-left:5px solid var(--c);border-radius:12px;background:#0b1d2f;margin-bottom:7px}.player.active{background:#142f48;box-shadow:0 0 0 1px #4d7695 inset}.player.dead{opacity:.5;filter:grayscale(.7)}.player .muted{color:var(--muted);font-size:11px}.money{font-size:20px;font-weight:1000;margin-top:2px;color:#f9d56a}.stat{display:flex;gap:10px;color:#c4d8e8;font-size:12px;margin-top:3px}.muted{color:var(--muted)}.current-box{font-size:13px;line-height:1.65}
.log{height:230px;overflow:auto;padding-right:5px;font-size:12px;line-height:1.6;color:#d1dfeb}.log div{padding:3px 0;border-bottom:1px solid #18344b}.rules{font-size:12px;line-height:1.7;color:#c5d7e6}
#modal{position:fixed;inset:0;background:rgba(1,7,13,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100;overflow:auto}.modalbox{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(145deg,#102a43,#0a1827);border:1px solid #416985;border-radius:20px;padding:18px;box-shadow:0 25px 80px #0009}.modalbox h2{margin:0 0 10px;font-size:23px}.modalbox p{color:#c9d8e5;line-height:1.65}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.choices button{border:1px solid #3a627e;background:#17354f;color:#fff;padding:12px;border-radius:12px;font-weight:900;text-align:left}.choices button:hover{filter:brightness(1.12)}.dice{display:flex;gap:10px;justify-content:center;margin:12px 0}.die{width:62px;height:62px;display:grid;place-items:center;background:#fff;color:#17212c;border-radius:12px;font-size:28px;font-weight:1000;box-shadow:0 8px 20px #0006}.result{padding:11px;border-radius:12px;background:#0a1b2c;border:1px solid #2c506a;text-align:center;font-weight:900}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{grid-template-columns:repeat(2,minmax(0,1fr))}.logcard{grid-column:1/-1}}
@media(max-width:680px){#app{padding:8px}header{padding:11px;align-items:flex-start}.top-actions{max-width:45%}.top-actions .btn{padding:8px 9px;font-size:12px}.layout{margin-top:8px}.panel{padding:8px}.sidebar{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls .btn:first-child{grid-column:1/-1}.board-scroll{padding:4px}.board{width:720px;min-width:720px}.modalbox{max-height:calc(100vh - 20px);padding:14px}.choices{grid-template-columns:1fr}.brand h1{font-size:28px}.brand p{font-size:10px}}

<body>
<div id="app">
<header><div class="brand"><div class="mark">R</div><div><h1>Re:VOLUTION</h1><p>REVOLUTIONARY BOARD GAME • SINGLE FILE</p></div></div><div class="top-actions"><button class="btn" onclick="showRules()">📖 ルール</button><button class="btn" onclick="newGame()">↻ 新しいゲーム</button></div></header>
<div class="layout">
<main class="panel">
<div class="turnbar"><strong id="turnText">ゲーム準備中</strong><span id="phase" class="badge">準備</span></div>
<div id="boardSelectBar" class="board-select-bar" style="display:none"><b id="boardSelectText"></b><button class="btn primary" onclick="confirmBoardSelection()">決定</button><button class="btn" onclick="cancelBoardSelection()">キャンセル</button></div>
<div id="setupHint" class="setup-note" style="display:none"></div>
<div class="muted" style="font-size:12px;margin:0 2px 5px">↔️ ボードは横にスクロールできます。スマホはスワイプ、PCはホイール＋ドラッグ、下のボタンでも移動できます。</div>
<div id="boardScroll" class="board-scroll"><div id="board" class="board"></div></div>
<div class="board-nav"><button class="btn" onclick="scrollBoard(-520)">◀ 左へ</button><button class="btn" onclick="scrollBoard(520)">右へ ▶</button></div>
<div class="controls"><button id="rollBtn" class="btn primary" onclick="rollDice()" disabled>🎲 サイコロを2個振る</button><button id="buyBtn" class="btn green" onclick="buyLand()" disabled>土地を買う</button><button id="buildBtn" class="btn gold" onclick="buildHere()" disabled>🏗️ 建物を建てる</button><button id="endBtn" class="btn cyan" onclick="endTurn()" disabled>⏭️ ターン終了</button></div>
</main>
<aside class="sidebar">
<div class="card"><h3>プレイヤー</h3><div id="players"></div></div>
<div class="card"><h3>現在のマス</h3><div id="current" class="current-box"></div></div>
<div class="card logcard"><h3>ゲームログ</h3><div id="log" class="log"></div></div>
<div class="card"><h3>ゲーム状態</h3><div id="status" class="rules"></div></div>
</aside>
</div></div>
<div id="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
const BOARD_W=720,BOARD_H=701;
const spaces=[
{n:'スタート',t:'go'},{n:'土地',t:'land',p:160},{n:'土地',t:'land',p:140},{n:'武器屋',t:'weapon'},{n:'土地',t:'land',p:120},{n:'イベント',t:'event'},{n:'市民広場',t:'square'},{n:'土地',t:'land',p:100},{n:'鉄道',t:'rail'},{n:'検問',t:'checkpoint'},
{n:'土地',t:'land',p:140},{n:'武器屋',t:'weapon'},{n:'鉄道',t:'rail'},{n:'市民広場',t:'square'},{n:'土地',t:'land',p:140},{n:'土地',t:'land',p:150},{n:'イベント',t:'event'},{n:'土地',t:'land',p:120},{n:'Go to Jail',t:'jail'},
{n:'土地',t:'land',p:160},{n:'電力会社',t:'power'},{n:'土地',t:'land',p:140},{n:'武器屋',t:'weapon'},{n:'土地',t:'land',p:120},{n:'土地',t:'land',p:150},{n:'鉄道',t:'rail'},{n:'土地',t:'land',p:160},{n:'カジノ',t:'casino'},
{n:'土地',t:'land',p:140},{n:'武器屋',t:'weapon'},{n:'土地',t:'land',p:150},{n:'土地',t:'land',p:100},{n:'イベント',t:'event'},{n:'土地',t:'land',p:120},{n:'鉄道',t:'rail'},{n:'土地',t:'land',p:140}
];
const players=[
{id:'cap',name:'資本家',role:'capitalist',money:3500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,color:'#e32643'},
{id:'w1',name:'労働者A',role:'worker',money:1500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,color:'#2d8cff'},
{id:'w2',name:'労働者B',role:'worker',money:1500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,color:'#8d58d6'},
{id:'w3',name:'労働者C',role:'worker',money:1500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,color:'#16a76f'}];
let current=0,rolled=false,moving=false,gameOver=false,boardMode=null,initialFactoryChoices=[],doublesThisTurn=0,doubleNext=false,lastDiceSum=0,revolutionCards=0,choiceFns=[];
let shop={};
function resetShops(){shop={};spaces.forEach((s,i)=>{if(s.t==='weapon')shop[i]={available:true,blocked:false}})}
resetShops();
// 具体表が元ルールに記載されていないため、配当はここで簡単に変更できる。
const casinoPayout={2:100,3:100,4:150,5:200,6:250,7:400,8:250,9:200,10:150,11:100,12:100};
function active(){return players[current]}
function spaceAt(i){return spaces[(i+spaces.length)%spaces.length]}
function money(n){return Math.round(n)+'ドル'}
function ownerOf(pos){return players.find(p=>p.alive&&p.lands.includes(pos))||null}
function buildingCount(p,pos){if(!p)return{factory:0,house:0};return p.build[pos]||(p.build[pos]={factory:0,house:0})}
function log(s){const e=document.getElementById('log');e.insertAdjacentHTML('beforeend','<div>• '+escapeHtml(s)+'</div>');e.scrollTop=e.scrollHeight}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function scrollBoard(dx){const e=document.getElementById('boardScroll');e.scrollBy({left:dx,behavior:'smooth'})}
// 画像の実寸720x701に合わせた外周36マスの当たり判定。四隅も独立したマスとして残す。
function boardRect(i){const L=79,R=641,T=82,B=618;const bw=(R-L)/8,bh=(B-T)/8;
 if(i===0)return[R,B,BOARD_W-R,BOARD_H-B];
 if(i===9)return[0,B,L,BOARD_H-B];
 if(i===18)return[0,0,L,T];
 if(i===27)return[R,0,BOARD_W-R,T];
 if(i>=1&&i<=8)return[R-(i-1)*bw,B,bw,BOARD_H-B];
 if(i>=10&&i<=17)return[0,T+(i-10)*bh,L,bh];
 if(i>=19&&i<=26)return[L+(i-19)*bw,0,bw,T];
 if(i>=28&&i<=35)return[R,T+(i-28)*bh,BOARD_W-R,bh];
 return[0,0,0,0]}
function renderBoard(){const b=document.getElementById('board');b.innerHTML='';const byPos={};players.filter(p=>p.alive).forEach(p=>(byPos[p.pos]??=[]).push(p));spaces.forEach((s,i)=>{const d=document.createElement('button');d.type='button';d.className='space';const r=boardRect(i);d.style.left=r[0]+'px';d.style.top=r[1]+'px';d.style.width=r[2]+'px';d.style.height=r[3]+'px';
 let selectable=false;
 if(boardMode==='initialFactory'&&s.t==='land'){selectable=true;d.classList.add('target');if(initialFactoryChoices.includes(i))d.classList.add('selected');d.onclick=()=>toggleInitialFactory(i)}
 if(boardMode==='build'&&s.t==='land'&&canBuild(active(),i)){selectable=true;d.classList.add('target','build-target');d.onclick=()=>selectBuildLand(i)}
 if(boardMode==='freeBuild'&&s.t==='land'&&canBuild(active(),i,true)){selectable=true;d.classList.add('target','selected');d.onclick=()=>selectFreeBuildLand(i)}
 const o=ownerOf(i);if(o){const bc=buildingCount(o,i);if(bc.factory||bc.house){const m=document.createElement('span');m.className='building-marker';m.textContent=(o.role==='capitalist'?'🏭':'🏠')+' '+(o.role==='capitalist'?bc.factory:bc.house);d.appendChild(m)}}
 const toks=document.createElement('div');toks.className='tokens';(byPos[i]||[]).forEach(p=>{const t=document.createElement('span');t.className='token '+(p.id==='cap'?'t-cap':p.id==='w1'?'t-w1':p.id==='w2'?'t-w2':'t-w3');t.textContent=p.id==='cap'?'C':p.id.slice(-1);toks.appendChild(t)});d.appendChild(toks);if(!selectable)d.onclick=null;b.appendChild(d)})}
function canBuild(p,pos,free=false){if(!p||!p.alive||!p.lands.includes(pos))return false;const b=buildingCount(p,pos);if(p.role==='capitalist')return b.factory<2&&(free||p.money>=150);return b.house<3&&(free||p.money>=120)}
function updateUI(){renderBoard();const p=active(),s=spaceAt(p.pos),o=ownerOf(p.pos),bc=o?buildingCount(o,p.pos):{factory:0,house:0};
 const bar=document.getElementById('boardSelectBar'),hint=document.getElementById('setupHint');
 if(boardMode==='initialFactory'){bar.style.display='flex';document.getElementById('boardSelectText').textContent=`🏭 資本家：初期工場を置く土地を3つ選択（${initialFactoryChoices.length}/3）`;hint.style.display='block';hint.textContent='黄色の枠が付いた土地を3つ選び、「決定」を押してください。'}
 else if(boardMode==='build'){bar.style.display='flex';document.getElementById('boardSelectText').textContent='🏗️ 建物を建てる土地を選択';hint.style.display='block';hint.textContent='青い枠の自分の土地を選んでください。'}
 else if(boardMode==='freeBuild'){bar.style.display='flex';document.getElementById('boardSelectText').textContent='🆓 無料建設：土地を選択';hint.style.display='block';hint.textContent='イベント7で建物を無料建設する土地を選んでください。'}
 else{bar.style.display='none';hint.style.display='none'}
 document.getElementById('turnText').textContent=gameOver?'ゲーム終了':`${p.name}のターン（${p.role==='capitalist'?'資本家':'労働者'}）`;
 document.getElementById('phase').textContent=boardMode?'土地選択':p.jail?'Go to Jail中':rolled?'マス処理完了':'サイコロ待ち';
 document.getElementById('players').innerHTML=players.map(x=>`<div class="player ${x===p?'active ':''}${x.alive?'':'dead'}" style="--c:${x.color}"><b>${x.name}</b> <span class="muted">${x.role==='capitalist'?'資本家':'労働者'}</span><div class="money">${money(x.money)}</div><div class="stat"><span>武器：${x.weapons}</span><span>回避：${x.avoidCards}</span><span>土地：${x.lands.length}</span></div><div class="muted">${x.alive?(x.jail?'刑務所':'参加中'):'破産'}</div></div>`).join('');
 document.getElementById('current').innerHTML=`<b>${s.n}</b>${s.p?`<br>土地価格：${s.p}ドル`:''}<br>所有：${o?o.name:'なし'}${o?`<br>工場：${bc.factory}　家：${bc.house}`:''}<br>回避カード：${p.avoidCards}枚 <button class="btn" style="padding:4px 7px;margin-top:5px" onclick="sellAvoidCard()" ${p.avoidCards?'':'disabled'}>1枚150ドルで売却</button>`;
 document.getElementById('status').innerHTML=`革命カード：<b>${revolutionCards} / 2</b><br>ゾロ目：<b>${doublesThisTurn}回</b>（このターン）<br>最後の出目：<b>${lastDiceSum||'—'}</b><br>現在位置：<b>${p.pos+1} / ${spaces.length}</b>`;
 document.getElementById('rollBtn').disabled=rolled||moving||gameOver||boardMode!==null||p.jail||!p.alive;
 document.getElementById('buyBtn').disabled=!rolled||moving||boardMode!==null||s.t!=='land'||!!ownerOf(p.pos)||!p.alive||p.money<(p.role==='capitalist'?0:s.p);
 document.getElementById('buildBtn').disabled=!rolled||moving||boardMode!==null||!p.lands.some(pos=>canBuild(p,pos))||!p.alive;
 // ターン終了は「サイコロを振った後」「ダブル継続ではない」「選択UIを開いていない」なら常に押せる。
 document.getElementById('endBtn').disabled=gameOver||moving||boardMode!==null||!p.alive||(!rolled && !p.jail)||document.getElementById('modal').style.display==='flex';
}
async function rollDice(){if(rolled||moving||gameOver||boardMode)return;const p=active();if(!p.alive)return;
 if(p.jail){if(p.money<150){log(`${p.name} は150ドルを払えないため刑務所から出られません。ターンを終了できます。`);rolled=true;updateUI();return}p.money-=150;p.jail=false;log(`${p.name} は150ドルを支払ってGo to Jailから出る。`);checkBankruptcy();if(!p.alive)return}
 const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),sum=a+b;lastDiceSum=sum;rolled=true;log(`${p.name}：🎲 ${a} + ${b} = ${sum}`);if(a===b)doublesThisTurn++;move(sum,a===b)}
async function move(n,isDouble){moving=true;updateUI();const p=active();for(let k=0;k<n;k++){p.pos=(p.pos+1)%spaces.length;if(p.pos===0)passStart(p);renderBoard();await new Promise(r=>setTimeout(r,85))}moving=false;
 if(doublesThisTurn>=3){goToJail(p,'3回ゾロ目');doublesThisTurn=0;rolled=true;checkBankruptcy();checkWin();updateUI();return}
 resolveSpace();
 if(isDouble&&!gameOver&&!p.jail){rolled=false;updateUI();log('ゾロ目なので、もう一度サイコロを振れます。')} else updateUI();}
function passStart(p){if(p.jail)return;p.money+=200;Object.values(shop).forEach(x=>x.available=true);log(`${p.name} がスタートを通過 → +200ドル。武器屋の在庫復活。`)}
function resolveSpace(){const p=active(),s=spaceAt(p.pos);const doubled=doubleNext;doubleNext=false;applySpace(p,s,doubled)}
function applySpace(p,s,doubled){const mul=doubled?2:1;
 if(s.t==='go'){p.money+=200*mul;log(`スタート：+${200*mul}ドル。`)}
 else if(s.t==='jail'){goToJail(p,'停止')}
 else if(s.t==='weapon')resolveWeaponShop(p,p.pos)
 else if(s.t==='factory')resolveFactorySpace(p,p.pos,mul)
 else if(s.t==='square'){if(p.role==='worker'){const amt=100*mul;players.filter(x=>x.alive&&x.role==='worker').forEach(w=>w.money+=amt);log(`市民広場：労働者全体に+${amt}ドル。`)}else{const amt=100*mul;players.filter(x=>x.alive&&x.role==='worker').forEach(w=>w.money-=amt);log(`市民広場：労働者全員に${amt}ドル支払い。`)}}
 else if(s.t==='power'){if(p.role==='worker'){const cap=players[0],gain=300*mul,loss=100*mul;cap.money+=gain;p.money-=loss;log(`電力会社：資本家+${gain}ドル、${p.name}- ${loss}ドル。`)}else{const fee=120*mul;p.money-=fee;log(`電力会社：維持費 ${fee}ドル。`)}}
 else if(s.t==='checkpoint'){if(p.role==='worker'){const n=p.weapons;p.weapons=0;log(`検問：武器カード${n}枚を没収。`)}}
 else if(s.t==='event'){eventCard();return}
 else if(s.t==='casino'){casino();return}
 else if(s.t==='rail'){log('鉄道：効果なし。')}
 else if(s.t==='land'){resolveLandLanding(p,s,mul)}
 checkBankruptcy();checkWin();updateUI()}
function resolveLandLanding(p,s,mul){
 const o=ownerOf(p.pos);
 if(!o){log(`土地（${s.p}ドル）：購入できます。`);return;}
 if(o===p){
   const b=buildingCount(p,p.pos);
   if(p.role==='capitalist'){
     const fee=100*b.factory*mul;
     if(fee){p.money-=fee;log(`工場維持費：${fee}ドル。`);}
   }else if(b.house){
     const rent=100*b.house*mul;
     p.money-=rent;players[0].money+=rent;
     log(`家賃：資本家へ ${rent}ドル。`);
   }
   return;
 }
 if(p.role==='capitalist'&&o.role==='worker'){
   const b=buildingCount(o,p.pos),pay=(s.p+100*b.house)*mul;
   p.money-=pay;o.money+=pay;
   log(`家のある土地へ：${o.name}に ${pay}ドル支払い。`);
 }else if(p.role==='worker'&&o.role==='capitalist'){
   const b=buildingCount(o,p.pos);
   if(b.factory){
     const capGain=250*b.factory*mul,workerGain=50*b.factory*mul;
     p.money+=workerGain;players[0].money+=capGain;
     log(`工場効果：資本家+${capGain}ドル、${p.name}+${workerGain}ドル。`);
   }
 }
}
function resolveFactorySpace(p,pos,mul){
 const cap=players[0],b=buildingCount(cap,pos);
 if(p===cap){const fee=100*b.factory*mul;if(fee){p.money-=fee;log(`工場維持費：${fee}ドル。`)}}
 else if(p.role==='worker'&&b.factory){const capGain=250*b.factory*mul,workerGain=50*b.factory*mul;p.money+=workerGain;cap.money+=capGain;log(`工場効果：資本家+${capGain}ドル、${p.name}+${workerGain}ドル。`)}
}
function resolveWeaponShop(p,pos){const ws=shop[pos]||(shop[pos]={available:true,blocked:false});if(p.role==='worker'){if(ws.blocked)log('武器屋：資本家に封鎖されています。');else if(!ws.available)log('武器屋：在庫切れ。スタート通過で復活します。');else if(p.money>=300){showChoice('🔫 武器屋','武器カードを300ドルで1枚購入できます。この店は購入後、在庫切れになります。',[['購入する',()=>{p.money-=300;p.weapons++;ws.available=false;closeModal();checkRevolution();checkBankruptcy();updateUI()}],['買わない',()=>{closeModal();updateUI()}]]);return}else log('武器屋：300ドル不足。')}else{ws.blocked=!ws.blocked;log(`資本家：武器屋を${ws.blocked?'封鎖':'封鎖解除'}。`)}}
function buyLand(){const p=active(),s=spaceAt(p.pos);if(!rolled||moving||boardMode||s.t!=='land'||ownerOf(p.pos)||p.money<s.p||!p.alive)return;const price=s.p;p.money-=price;p.lands.push(p.pos);p.build[p.pos]={factory:0,house:0};log(`${p.name} が土地を ${price}ドルで購入。`);if(p.role==='capitalist'){if(p.money>=150){p.build[p.pos].factory=1;p.money-=150;log('資本家：購入時に工場1つを必ず建設（150ドル）。')}else{p.money+=price;p.lands.pop();delete p.build[p.pos];log('工場150ドルが足りないため土地購入を取り消し。')}}else{if(p.money>=120){p.build[p.pos].house=1;p.money-=120;log('労働者：購入時に家1つを必ず建設（120ドル）。')}else{p.money+=price;p.lands.pop();delete p.build[p.pos];log('家120ドルが足りないため土地購入を取り消し。')}}checkBankruptcy();checkWin();updateUI()}
function buildHere(){const p=active();if(!rolled||moving||boardMode||!p.alive)return;if(!p.lands.some(pos=>canBuild(p,pos))){log('建設可能な自分の土地がありません。');return}boardMode='build';updateUI()}
function selectBuildLand(pos){const p=active();if(boardMode!=='build'||!canBuild(p,pos))return;const b=buildingCount(p,pos);if(p.role==='capitalist'){b.factory++;p.money-=150;log('工場を150ドルで建設。')}else{b.house++;p.money-=120;log('家を120ドルで建設。')}boardMode=null;checkBankruptcy();updateUI()}
function toggleInitialFactory(pos){if(boardMode!=='initialFactory'||spaceAt(pos).t!=='land')return;const i=initialFactoryChoices.indexOf(pos);if(i>=0)initialFactoryChoices.splice(i,1);else if(initialFactoryChoices.length<3)initialFactoryChoices.push(pos);updateUI()}
function confirmInitialFactories(){if(initialFactoryChoices.length!==3)return;const cap=players[0];initialFactoryChoices.forEach(pos=>{cap.lands.push(pos);cap.build[pos]={factory:1,house:0}});log('資本家：初期工場3つを配置しました。');initialFactoryChoices=[];boardMode=null;updateUI()}
function selectFreeBuildLand(pos){const p=active();if(boardMode!=='freeBuild'||!canBuild(p,pos,true))return;const b=buildingCount(p,pos);if(p.role==='capitalist')b.factory++;else b.house++;log(`イベント7：${p.role==='capitalist'?'工場':'家'}を無料建設。`);boardMode=null;checkBankruptcy();updateUI()}
function cancelBoardSelection(){if(boardMode==='initialFactory')initialFactoryChoices=[];boardMode=null;updateUI()}
function confirmBoardSelection(){if(boardMode==='initialFactory')confirmInitialFactories();else if(boardMode==='build'){boardMode=null;updateUI()}else if(boardMode==='freeBuild'){boardMode=null;updateUI()}}
function goToJail(p,reason='イベント'){
 const send=()=>{p.pos=18;p.jail=true;if(p.weapons>0){p.weapons--;log(`${p.name}：${reason} → 武器カード1枚没収。`)}else log(`${p.name}：${reason} → Go to Jail。`);updateUI()};
 if(p.avoidCards>0){showChoice('🚨 Go to Jail','回避カードを1枚使って回避できます。',[['回避カードを使う',()=>{p.avoidCards--;log(`${p.name}：回避カードを使用して回避。`);closeModal();updateUI()}],['Go to Jailへ',()=>{send();closeModal();updateUI()}]]);return}
 send();
}
function casino(){const p=active(),a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),sum=a+b,amount=casinoPayout[sum]||0;showChoice('🎰 カジノ',`<div class="dice"><div class="die">${a}</div><div class="die">${b}</div></div><div class="result">合計 ${sum} → 配当 ${amount}ドル</div>`,[['結果を確定',()=>{p.money+=amount;log(`カジノ：${sum} → +${amount}ドル。`);closeModal();checkBankruptcy();checkWin();updateUI()}]])}
function stealFromEnemy(amount){const p=active();let got=0;if(p.role==='worker'){const cap=players[0];got=Math.min(Math.max(0,cap.money),amount);cap.money-=got;p.money+=got;return got}for(const w of players.filter(x=>x.role==='worker'&&x.alive)){if(got>=amount)break;const take=Math.min(Math.max(0,w.money),amount-got);w.money-=take;got+=take}p.money+=got;return got}
function eventCard(){const p=active(),n=2+Math.floor(Math.random()*11);log(`❓ イベントカード ${n}`);
 if(n===2){const amount=lastDiceSum*60,got=stealFromEnemy(amount);log(`出目×60 → ${got}ドルを敵陣営から奪う。`)}
 else if(n===3){doubleNext=true;rolled=false;log('次のマスの効果を2倍。もう一度サイコロを振ります。');updateUI();setTimeout(rollDice,250);return}
 else if(n===4){if(p.role==='capitalist'){const ws=players.filter(x=>x.role==='worker'&&x.alive&&x.weapons>0);if(ws.length){ws[0].weapons--;p.weapons++;log('資本家：武器カード1枚を回収。')}else log('回収できる武器カードがありません。')}else{p.weapons++;log('労働者：武器カード1枚を入手。');checkRevolution()}}
 else if(n===5){p.pos=27;log('カジノへテレポート。');casino();return}
 else if(n===6){p.pos=0;p.money+=200;Object.values(shop).forEach(x=>x.available=true);log('スタートに戻る → +200ドル。武器屋在庫復活。')}
 else if(n===7){openFreeBuild();return}
 else if(n===8){const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),amount=(a+b)*50;p.money+=amount;log(`イベント8：${a}+${b} × 50 → +${amount}ドル。`)}
 else if(n===9){if(p.role==='capitalist'){p.money+=200;log('資本家 +200ドル。')}else{players.filter(x=>x.role==='worker'&&x.alive).forEach(w=>w.money+=100);log('労働者全員 +100ドル。')}}
 else if(n===10){p.avoidCards++;log('Go to Jail／検問回避カードを1枚入手（150ドルで売却可）。')}
 else if(n===11){if(p.avoidCards)showChoice('🚨 強制Go to Jail','検問回避カードを使って回避することもできます。',[['カードを使う',()=>{p.avoidCards--;log('回避カードを使用。Go to Jailを回避。');closeModal();updateUI()}],['Go to Jailへ',()=>{goToJail(p,'イベント11');closeModal();checkBankruptcy();updateUI()}]]);else{goToJail(p,'イベント11');updateUI()}return}
 else if(n===12){if(p.role==='capitalist'){const candidates=spaces.map((s,i)=>({s,i})).filter(x=>x.s.t==='weapon'&&!shop[x.i].blocked);if(candidates.length){showChoice('🏭 イベント12','工場に変更する武器屋を選択してください。',candidates.map(x=>[`武器屋（${x.i+1}番）を工場化`,()=>{spaces[x.i].t='factory';delete spaces[x.i].p;capFactoryConvert(x.i);delete shop[x.i];log('武器屋を工場に変更しました。');closeModal();updateUI()}]));return}else log('変更できる武器屋がありません。')}else{openWorkerWeaponConversion();return}}
 checkBankruptcy();checkWin();updateUI()}
function capFactoryConvert(pos){const p=players[0];if(!p.lands.includes(pos))p.lands.push(pos);p.build[pos]={factory:1,house:0}}
function openFreeBuild(){const p=active();if(!p.lands.some(pos=>canBuild(p,pos,true))){log('イベント7：建設できる土地がありません。');updateUI();return}boardMode='freeBuild';updateUI()}
function openWorkerWeaponConversion(){const p=active(),choices=p.lands.filter(pos=>spaceAt(pos).t==='land');if(!choices.length){log('イベント12：武器屋にできる土地がありません。');updateUI();return}showChoice('🔫 イベント12：武器屋化','武器屋に変更する自分の土地を選択してください。',choices.map(pos=>[`土地（${spaceAt(pos).p}ドル）→ 武器屋`,()=>{spaces[pos].t='weapon';delete spaces[pos].p;shop[pos]={available:true,blocked:false};log('自分の土地を武器屋に変更しました。');closeModal();updateUI()}]));}
function checkRevolution(){const total=players.filter(p=>p.role==='worker'&&p.alive).reduce((n,p)=>n+p.weapons,0);const earned=Math.min(2,Math.floor(total/3));if(earned>revolutionCards){const delta=earned-revolutionCards;revolutionCards=earned;log(`🔥 革命カード +${delta}`);log(`労働者全体の武器カード3枚で革命カード1枚。現在 ${revolutionCards} / 2`);}}
function handleBankruptcyPlayer(p){if(!p.alive||p.money>=0)return;showChoice(`💥 ${p.name}：破産判定`,`資産を売却して負債を返済できます。土地は1つ80ドル、建物は1つ70ドル。`,[['全資産を売却',()=>{let cash=0;for(const pos of p.lands.slice()){cash+=80;const b=buildingCount(p,pos);cash+=(b.factory+b.house)*70;delete p.build[pos]}p.lands=[];p.money+=cash;log(`${p.name}：資産を銀行へ売却 → +${cash}ドル。`);if(p.money<0)declareBankrupt(p);closeModal();checkWin();updateUI()}],['売却せず破産',()=>{declareBankrupt(p);closeModal();checkWin();updateUI()}]])}
function declareBankrupt(p){p.alive=false;p.lands=[];p.build={};p.weapons=0;log(`⚠️ ${p.name} が破産。`)}
function checkBankruptcy(){for(const p of players)if(p.alive&&p.money<0){handleBankruptcyPlayer(p);return true}return false}
function checkWin(){if(gameOver)return;if(!players[0].alive){gameOver=true;showEnd('労働者側の勝利！','資本家が破産しました。');return}if(players.filter(p=>p.role==='worker'&&!p.alive).length>=2){gameOver=true;showEnd('資本家側の勝利！','労働者が2人以上破産しました。');return}if(players[0].money>=6000){gameOver=true;showEnd('資本家側の勝利！','資本家が6000ドルに到達しました。');return}if(revolutionCards>=2){gameOver=true;showEnd('労働者側の勝利！','革命カード2枚を獲得しました。')}}
function sellAvoidCard(){const p=active();if(!p.avoidCards)return;p.avoidCards--;p.money+=150;log(`${p.name} が回避カード1枚を150ドルで売却。`);updateUI()}
function showChoice(title,body,opts){choiceFns=opts.map(x=>x[1]);document.getElementById('modal').style.display='flex';document.getElementById('modalbox').innerHTML=`<h2>${title}</h2><div>${body}</div><div class="choices">${opts.map((x,i)=>`<button onclick="choiceFns[${i}]()">${x[0]}</button>`).join('')}</div>`}
function closeModal(){document.getElementById('modal').style.display='none';choiceFns=[]}
function showEnd(title,text){document.getElementById('modal').style.display='flex';document.getElementById('modalbox').innerHTML=`<h2>🏆 ${title}</h2><p>${text}</p><button class="btn primary" onclick="closeModal()">閉じる</button>`}
function showRules(){document.getElementById('modal').style.display='flex';document.getElementById('modalbox').innerHTML=`<h2>📖 Re:VOLUTION ルール</h2><div class="rules"><b>① ゲーム進行</b><br>サイコロ2つを振って出た目の数だけ時計回りに進む。ゾロ目ならもう一度振る。3回ゾロ目でGo to Jailへ。<br><br><b>革命カード</b><br>労働者全体の武器カード3枚で革命カード1枚。2枚で労働者勝利。<br><br><b>ゲーム開始</b><br>資本家は好きな土地3つに工場を1つずつ初期配置。<br><br><b>② マス</b><br>スタート：止まる／通ると200ドル。<br>Go to Jail：止まると武器カード1枚没収。入っている間は金の入手・オークション参加不可。次ターンに150ドルで出る。<br>カジノ：サイコロ2個を振り、出目に応じた配当。<br>イベント：イベントカード。<br>検問：止まった労働者の武器カードをすべて没収。<br>武器屋：労働者300ドルで武器1枚。1店舗1枚まで。購入後は在庫切れ、スタート通過で復活。資本家が止まるとその店を封鎖／解除。<br>市民広場：労働者が止まると労働者全体+100ドル。資本家が止まると労働者全員に100ドルずつ支払う。<br>電力会社：労働者が止まると資本家+300ドル、その労働者-100ドル。資本家は維持費120ドル。<br>土地：資本家無料、労働者は表示価格。購入時または再度停止時に建物。譲渡・売却不可。<br><br><b>③ 建物</b><br>工場150ドル、1土地2つまで。資本家は土地購入時に必ず1つ。資本家停止で100ドル×工場数。労働者停止で資本家に250ドル×工場数、停止した労働者に50ドル×工場数。<br>家120ドル、1土地3つまで。労働者は土地購入時に必ず1つ。資本家停止で土地価格+100ドル×家数をその労働者へ。労働者停止で資本家に100ドル×家数。<br><br><b>④ 破産</b><br>マイナスになったら土地80ドル、建物70ドルで銀行へ売却可能。売却した土地は無所有。すべて売却してもマイナスなら破産。資本家破産＝労働者勝利、労働者2人以上破産＝資本家勝利。<br><br><b>イベント 2〜12</b><br>2：サイコロの出目×60ドルを敵陣営から奪う。 3：次のマス効果2倍＋再度サイコロ。 4：資本家＝武器回収／労働者＝武器入手。 5：カジノへテレポートし強制開始。 6：スタートに戻る。 7：自分の土地に建物無料。 8：サイコロ2個の和×50ドル。 9：資本家+200／労働者全員+100。 10：Go to Jail／検問回避カード（150ドルで売却可）。 11：強制Go to Jail。 12：資本家＝武器屋を工場化／労働者＝自分の土地を武器屋化。</div><br><button class="btn" onclick="closeModal()">閉じる</button>`}
function endTurn(){if(gameOver||moving||boardMode)return;const p=active();if(!p.alive)return;if(!rolled&&!p.jail)return;closeModal();doublesThisTurn=0;doubleNext=false;rolled=false;current=nextAlive(current);log(`— ${p.name} のターン終了 → ${active().name} のターン —`);updateUI()}
function nextAlive(i){for(let k=1;k<=players.length;k++){const j=(i+k)%players.length;if(players[j].alive)return j}return i}
function newGame(){players.forEach(p=>Object.assign(p,{money:p.role==='capitalist'?3500:1500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false}));spaces.forEach((s,i)=>{if(['factory'].includes(s.t)){s.t='weapon'}}); // 変換済み特殊マスは基本状態へ
 // 土地以外のマスは初期定義どおりに戻す
 const base=['go','land','land','weapon','land','event','square','land','rail','checkpoint','land','weapon','rail','square','land','land','event','land','jail','land','power','land','weapon','land','land','rail','land','casino','land','weapon','land','land','event','land','rail','land'];
 const prices=[null,160,140,null,120,null,null,100,null,null,140,null,null,null,140,150,null,120,null,160,null,140,null,120,150,null,160,null,140,null,150,100,null,120,null,140];
 spaces.forEach((s,i)=>{s.t=base[i];if(prices[i]===null)delete s.p;else s.p=prices[i];s.n=s.t==='jail'?'Go to Jail':s.t==='go'?'スタート':s.t==='land'?'土地':s.t==='weapon'?'武器屋':s.t==='event'?'イベント':s.t==='square'?'市民広場':s.t==='rail'?'鉄道':s.t==='checkpoint'?'検問':s.t==='casino'?'カジノ':s.n});
 resetShops();current=0;rolled=false;moving=false;gameOver=false;boardMode='initialFactory';initialFactoryChoices=[];doublesThisTurn=0;doubleNext=false;lastDiceSum=0;revolutionCards=0;choiceFns=[];document.getElementById('log').innerHTML='';log('新しいゲーム開始。資本家はボード上から好きな土地3つを選び、初期工場を配置してください。');closeModal();updateUI()}
// ボードをマウスドラッグでも横移動できるようにする。
(()=>{const e=document.getElementById('boardScroll');let down=false,startX=0,startLeft=0;e.addEventListener('pointerdown',ev=>{if(ev.pointerType==='mouse'){down=true;startX=ev.clientX;startLeft=e.scrollLeft;e.classList.add('dragging');e.setPointerCapture(ev.pointerId)}});e.addEventListener('pointermove',ev=>{if(down)e.scrollLeft=startLeft-(ev.clientX-startX)});e.addEventListener('pointerup',()=>{down=false;e.classList.remove('dragging')});e.addEventListener('pointercancel',()=>{down=false;e.classList.remove('dragging')})})();
newGame();
</script>
</body></html>
